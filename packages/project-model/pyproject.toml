[project]
name = "galgame-project-model"
version = "0.1.0"
description = "Shared data models for the galgame translater pipeline"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
