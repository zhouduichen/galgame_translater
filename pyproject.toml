[project]
name = "galgame-translater"
version = "0.1.0"
description = "Novel-to-visual-novel pipeline with Web preview, editor, and Ren'Py export"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["apps", "packages"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true
